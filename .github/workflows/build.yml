name: build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --legacy-peer-deps
      - run: rm -rf android && npx expo prebuild -p android --clean --no-install
      - run: |
          mkdir -p android/app/src/main/res/values
          echo '<resources><color name="splashscreen_background">#FFF</color></resources>' > android/app/src/main/res/values/colors.xml
          sed -i "s/@color\/splashscreen_background/#FFFFFF/g" android/app/src/main/res/values/strings.xml || true
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease -x lint
      - uses: actions/upload-artifact@v4
        with:
          name: NewNET-APK
          path: android/app/build/outputs/apk/release/app-release.apk

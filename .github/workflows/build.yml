name: Build AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: |
          npx expo prebuild --platform android --clean
          cd android
          mkdir -p app
          keytool -genkey -v -keystore app/my-upload-key.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=NewNET, OU=Dev, O=NewNET, L=Port, S=Rivers, C=NG"
          echo "MYAPP_UPLOAD_STORE_FILE=my-upload-key.keystore" >> gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=my-key-alias" >> gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=123456" >> gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=123456" >> gradle.properties
          chmod +x gradlew
         ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab

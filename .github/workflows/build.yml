name: build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --legacy-peer-deps
      - run: rm -rf android && npx expo prebuild -p android --clean --no-install
      - name: FIX ALL COLORS - FINAL
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="splashscreen_background">#FFFFFF</color>
            <color name="splashscreen_background_dark">#000000</color>
            <color name="colorPrimary">#00C6FF</color>
            <color name="colorPrimaryDark">#0096CC</color>
            <color name="colorAccent">#FF2D78</color>
            <color name="primary">#00C6FF</color>
          </resources>
          EOF
          cat android/app/src/main/res/values/colors.xml
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon -x lint
      - uses: actions/upload-artifact@v4
        with:
          name: NewNET-APK-FINAL
          path: android/app/build/outputs/apk/release/app-release.apk
